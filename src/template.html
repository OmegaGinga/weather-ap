<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather The App</title>
</head>
<body>
    <div class="container">
        <div class="weather-form">
            <form action="get" class="search-form" novalidate>
                <div class="input">
                    <label for="city-code" class="city-code-text">Search</label>
                    <input type="text" name="city-code" id="city-code" placeholder="Enter City name or ZipCode">
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
        <div class="weather-container">            
                <div class="current-weather">
                    <div class="current-title">
                        <h2>Current Weather</h2>                        
                    </div>
                    <div class="current-data"></div>
                </div>
                <div class="hourly-weather">
                    <div class="hourly-title">
                        <h2>Hourly Forecast</h2>
                    </div>
                    <div class="hourly-data"></div>
                </div>                       
        </div>
        <div class="next-container">
            <div class="next-title">
                <h2>Next Days Forecast</h2>
            </div>
            <div class="next-days-weather"></div>
        </div>  
    </div>
</body>
</html>
